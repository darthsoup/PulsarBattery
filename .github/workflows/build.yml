name: build

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore .\PulsarBattery.slnx

      - name: Test device protocols
        run: dotnet test .\PulsarBattery.Device.Tests\PulsarBattery.Device.Tests.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish .\PulsarBattery\PulsarBattery.csproj -c Release -p:Platform=x64 -p:PublishProfile=win-x64 --no-restore

      - name: Upload exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: PulsarBattery-win-x64
          path: PulsarBattery\bin\Publish\win-x64\PulsarBattery.exe
          if-no-files-found: error
