name: build

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.402"

      - name: Test release version validation
        run: .\.github\scripts\Test-ReleaseVersion.ps1

      - name: Restore
        run: dotnet restore .\PulsarBattery.slnx -p:Configuration=Release

      - name: Test protocols and app services
        run: dotnet test .\PulsarBattery.Device.Tests\PulsarBattery.Device.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Publish
        run: dotnet publish .\PulsarBattery\PulsarBattery.csproj -c Release -p:Platform=x64 -p:PublishProfile=win-x64 --no-restore

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload exe artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PulsarBattery-win-x64
          path: PulsarBattery/bin/Publish/win-x64/PulsarBattery.exe
          if-no-files-found: error
          retention-days: 14
