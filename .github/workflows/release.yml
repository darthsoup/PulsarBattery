name: release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Test release version validation
        run: .\.github\scripts\Test-ReleaseVersion.ps1

      - name: Validate tag and update manifests
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: .\.github\scripts\Set-ReleaseVersion.ps1 -Tag $env:RELEASE_TAG

      - name: Restore
        run: dotnet restore .\PulsarBattery.slnx -p:Configuration=Release

      - name: Test protocols and app services
        run: dotnet test .\PulsarBattery.Device.Tests\PulsarBattery.Device.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Publish
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          WINDOWS_VERSION: ${{ steps.version.outputs.windows_version }}
        run: >-
          dotnet publish .\PulsarBattery\PulsarBattery.csproj
          -c Release
          -p:Platform=x64
          -p:PublishProfile=win-x64
          --no-restore
          "-p:Version=$env:RELEASE_VERSION"
          "-p:FileVersion=$env:WINDOWS_VERSION"
          "-p:AssemblyVersion=$env:WINDOWS_VERSION"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Package release and checksum
        run: |
          $exe = Get-Item 'PulsarBattery\bin\Publish\win-x64\PulsarBattery.exe'
          if ($exe.Length -eq 0) { throw 'Published executable is empty.' }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $zip = 'artifacts\PulsarBattery-win-x64.zip'
          Compress-Archive -LiteralPath $exe.FullName -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PulsarBattery-win-x64.zip" | Set-Content 'artifacts\SHA256SUMS.txt' -Encoding ascii

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: artifacts

      - name: Verify release archive
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/PulsarBattery-win-x64.zip
            artifacts/SHA256SUMS.txt
