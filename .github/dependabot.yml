version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "nuget"
    directories:
      - "/PulsarBattery"
      - "/PulsarBattery.Device"
      - "/PulsarBattery.Device.Tests"
    schedule:
      interval: "weekly"
    groups:
      dotnet-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
